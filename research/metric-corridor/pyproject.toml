[project]
name = "sightguard-metric-corridor-experiments"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0+cu130",
  "torchvision==0.25.0+cu130",
  "numpy==2.5.3",
  "opencv-python-headless==4.13.0.92",
  "onnx==1.23.2",
  "onnxruntime-gpu==1.31.0",
  "PyYAML==6.0.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
