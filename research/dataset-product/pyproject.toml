[project]
name = "sightguard-public-dataset-comparison"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0+cu130",
  "torchvision==0.25.0+cu130",
  "numpy==2.5.3",
  "opencv-python-headless==4.13.0.92",
  "onnxruntime-gpu==1.31.0",
  "h5py==3.16.0",
  "PyYAML==6.0.3",
  "mmengine==0.10.7",
  "mmcv-lite==2.2.0",
  "einops==0.8.2",
  "timm==1.0.30",
  "matplotlib==3.11.2",
  "scipy==1.18.1",
  "yapf==0.43.0",
  "addict==2.4.0",
  "rich==15.0.0",
  "termcolor==3.3.0",
  "yacs==0.1.8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
